version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: medicare-mongo
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: medicare_pro
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medicare-server
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/medicare_pro
      JWT_SECRET: super_secure_jwt_medicare_production_key_2026
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medicare-client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo-data:
